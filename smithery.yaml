startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - ionosToken
    properties:
      ionosToken:
        type: string
        description: IONOS CLOUD API token for authentication.
      ionosS3AccessKey:
        type: string
        description: S3 access key for IONOS Object Storage (optional).
      ionosS3SecretKey:
        type: string
        description: S3 secret key for IONOS Object Storage (optional).
      eagerLoad:
        type: boolean
        description: Register all tools at startup instead of lazy loading Compute and Object Storage.
  commandFunction:
    |-
    (config) => ({
      command: '/ionoscloud-mcp',
      args: [],
      env: {
        IONOS_TOKEN: config.ionosToken,
        ...(config.ionosS3AccessKey && { IONOS_S3_ACCESS_KEY: config.ionosS3AccessKey }),
        ...(config.ionosS3SecretKey && { IONOS_S3_SECRET_KEY: config.ionosS3SecretKey }),
        ...(config.eagerLoad && { IONOS_MCP_EAGER_LOAD: 'true' })
      }
    })
  exampleConfig:
    ionosToken: your-ionos-token
