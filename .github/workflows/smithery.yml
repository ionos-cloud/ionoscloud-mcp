name: Publish to Smithery

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          VERSION="${{ github.event.workflow_run.head_branch }}"
          VERSION="${VERSION#v}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.serverVersion=${VERSION}" \
            -o ionoscloud-mcp-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ionoscloud-mcp-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    name: Publish to Smithery
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Prepare bundle
        run: |
          VERSION="${{ github.event.workflow_run.head_branch }}"
          VERSION="${VERSION#v}"
          mkdir -p bundle
          cp ionoscloud-mcp-* bundle/
          jq --arg v "$VERSION" '.version = $v' smithery/manifest.json > bundle/manifest.json

      - name: Pack MCPB bundle
        run: mcpb pack ./bundle ./ionoscloud-mcp.mcpb

      - name: Publish to Smithery
        run: npx @smithery/cli mcp publish ./ionoscloud-mcp.mcpb -n ionos-cloud/ionoscloud-mcp
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_TOKEN }}
