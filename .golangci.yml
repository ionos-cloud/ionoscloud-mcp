version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign 
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow 

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ionos-cloud/ionoscloud-mcp
