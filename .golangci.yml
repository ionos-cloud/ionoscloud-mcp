run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - gofmt
    - goimports
    - ineffassign
    - unused
    - misspell
    - gosimple

linters-settings:
  goimports:
    local-prefixes: github.com/ionos-cloud/ionoscloud-mcp
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow

issues:
  exclude-dirs:
    - test
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
